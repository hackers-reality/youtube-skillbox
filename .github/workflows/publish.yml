name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate and publish to PyPI
    # Manual runs are permitted only when the selected ref is a version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest

      - name: Run test suite
        run: python -m pytest

      - name: Clean dist
        run: rm -rf dist

      - name: Build package
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/ytdata-smoke
          /tmp/ytdata-smoke/bin/python -m pip install dist/*.whl
          /tmp/ytdata-smoke/bin/ytdata --version
          /tmp/ytdata-smoke/bin/ytdata --help

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC trusted publishing (no API token needed) and provides provenance metadata